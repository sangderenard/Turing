<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#182438">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Turing Mobile</title>
  <style>
    html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;touch-action:none}
    #status{position:fixed;left:env(safe-area-inset-left);top:env(safe-area-inset-top);padding:12px;color:white;font:13px system-ui;opacity:.8}
  </style>
</head>
<body>
<canvas id="surface"></canvas><div id="status">Loading Turing WebAssembly…</div>
<script type="module">
import {TuringWasmProgram} from './turing-wasm-shell.js';
const compiled = await TuringWasmProgram.load('mobile_main.wasm','program.abi.json');
const canvas = document.querySelector('#surface');
const gl = canvas.getContext('webgl2', {antialias:false});
if (!gl) throw new Error('WebGL 2 is required');
const compile=(type,source)=>{const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(shader));return shader};
const program=gl.createProgram();
gl.attachShader(program,compile(gl.VERTEX_SHADER,`#version 300 es\nconst vec2 p[3]=vec2[3](vec2(-1.,-1.),vec2(3.,-1.),vec2(-1.,3.));out vec2 uv;void main(){gl_Position=vec4(p[gl_VertexID],0.,1.);uv=p[gl_VertexID]*.5+.5;}`));
gl.attachShader(program,compile(gl.FRAGMENT_SHADER,`#version 300 es\nprecision highp float;in vec2 uv;uniform vec3 color;out vec4 outColor;void main(){float v=.72+.28*(1.-length(uv-vec2(.5)));outColor=vec4(color*v,1.);}`));
gl.linkProgram(program); if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program); const color=gl.getUniformLocation(program,'color');
let touch=[.5,.5]; canvas.addEventListener('pointermove',e=>{touch=[e.clientX/innerWidth,e.clientY/innerHeight]});
const resize=()=>{canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;gl.viewport(0,0,canvas.width,canvas.height)}; addEventListener('resize',resize);resize();
document.querySelector('#status').textContent='Turing WASM · drag to change color';
function frame(ms){const result=compiled.invoke({phase:.5+.5*Math.sin(ms*.0007),touch_x:touch[0],touch_y:touch[1]});gl.uniform3f(color,result.red,result.green,result.blue);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(frame)}requestAnimationFrame(frame);
if('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
</script>
</body>
</html>
