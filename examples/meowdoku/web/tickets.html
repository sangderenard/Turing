<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meowdoku tickets</title>
<style>
body{margin:0;background:#0c0e13;color:#d8dde6;font:14px system-ui,sans-serif}header{display:flex;gap:1em;align-items:center;padding:12px;border-bottom:1px solid #354055}button,select,textarea{background:#1b2029;color:inherit;border:1px solid #45546b;border-radius:5px;padding:6px;font:inherit}main{display:grid;grid-template-columns:minmax(250px,32%) 1fr;height:calc(100vh - 58px)}#list{overflow:auto;border-right:1px solid #354055;padding:8px}#detail{overflow:auto;padding:12px}.row{display:block;width:100%;text-align:left;padding:10px;margin:0 0 5px;white-space:pre-line}.row small{display:block;color:#9eacbf;margin-top:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#141a22;padding:12px;border-radius:6px;line-height:1.4}textarea{display:block;width:min(100%,700px);height:70px;box-sizing:border-box}#actions{display:flex;gap:8px;margin:10px 0}summary{cursor:pointer;padding:8px;border:1px solid #354055;border-radius:5px;margin-top:10px}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.facts div{background:#141a22;border:1px solid #354055;border-radius:6px;padding:10px}.facts strong{display:block;color:#9eacbf;font-size:12px;margin-bottom:5px}@media(max-width:700px){main{display:block;height:auto}#list{max-height:35vh;border-right:0;border-bottom:1px solid #354055}}
</style></head><body><header><strong>Diagnostic tickets</strong><button id="refresh">Refresh</button><a href="log.html" style="color:#9bd">Server log</a><span id="message" role="status"></span></header>
<main><section id="list" aria-label="Tickets"></section><section id="detail"><p>Select a ticket.</p></section></main>
<script type="module" src="tickets.js"></script></body></html>
