<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World map</title>
<link rel="stylesheet" href="/agent-presence.css">
<style>
  :root { color-scheme: dark; --bg:var(--palette-bg,#17171a); --fg:var(--palette-fg,#ececee); --mut:var(--palette-muted,#9a9aa1); --line:var(--palette-line,#37373d); --acc:var(--palette-ink,#7db0ff); --card:var(--palette-surface,#202024); }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; }
  [hidden] { display:none !important; }
  main { max-width:96rem; margin:0 auto; padding:1rem 16px 3rem; }
  a, .link { color:var(--acc); } h1 { font-size:1.3rem; margin:.4rem 0; } h2 { font-size:1rem; margin:.2rem 0; word-break:break-all; } h3 { font-size:.95rem; margin:.8rem 0 .3rem; }
  .bar { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; margin:.5rem 0; }
  select, input[type=search], button { font:inherit; padding:.3rem .6rem; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); max-width:100%; }
  button { cursor:pointer; } button.link { border:0; background:none; padding:0; text-align:left; color:var(--acc); word-break:break-all; } button.crumb { padding:.1rem .4rem; }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) 22rem; gap:1rem; align-items:start; }
  @media (max-width:800px) { .layout { grid-template-columns:minmax(0,1fr); } }
  .stage { background:var(--card); border:1px solid var(--line); border-radius:6px; overflow:hidden; } canvas { display:block; touch-action:none; }
  .agent-map-shelf { max-height:10rem; overflow:auto; padding:.3rem .5rem; border-top:1px solid var(--palette-line,#60728c); font-size:.75rem; }
  .agent-map-shelf summary { cursor:pointer; font-weight:600; }
  #agent-map-entities { display:flex; flex-wrap:wrap; gap:.2rem .4rem; padding-top:.3rem; }
  .agent-map-entity { display:inline-flex; gap:.2rem; align-items:center; padding:.1rem .25rem; border:1px solid var(--palette-line,#505b70); border-radius:3px; background:var(--palette-surface,#1d2531); white-space:nowrap; font-size:.75rem; }
  .agent-map-light.active { color:#9ce8af; } .agent-map-where { color:var(--palette-muted,#b7c5d7); }
  #panel { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:.5rem 1rem; max-height:78vh; overflow:auto; }
  .plist { list-style:none; margin:0; padding:0; } .plist li { padding:.15rem 0; border-bottom:1px solid var(--line); }
  .chip { display:inline-flex; align-items:center; gap:.3rem; margin-right:.7rem; font-size:.85rem; } .chip i { width:.8rem; height:.8rem; display:inline-block; border-radius:2px; }
  #overview { display:grid; grid-template-columns:repeat(auto-fit,minmax(15rem,1fr)); gap:.7rem; margin:1rem 0; }
  .repo-region { display:block; width:100%; min-height:7rem; padding:.8rem; text-align:left; border-color:var(--palette-line,#60728c); }
  .repo-region strong, .repo-region small { display:block; overflow-wrap:anywhere; }
  .repo-region small { color:var(--mut); margin-top:.4rem; }
  .file-actions { display:flex; flex-wrap:wrap; gap:.3rem; margin:.4rem 0 .8rem; }
  .file-actions button { font-size:.8rem; }
  .file-actions input { width:100%; }
  .region-files { max-height:24rem; overflow:auto; }
  .region-file { padding:.5rem 0; border-bottom:1px solid var(--line); overflow-wrap:anywhere; }
  #action-status { min-height:1.4em; }
  .mut { color:var(--mut); } .bad { color:#ff8a80; } #tip { min-height:1.4em; font:13px ui-monospace, Consolas, monospace; color:var(--mut); }
</style>
</head>
<body>
<main>
  <nav><a href="/browse">Back to browse</a></nav>
  <h1>World map</h1>
  <p id="status" class="mut" role="status">Loading...</p>
  <div id="overview" aria-label="Repository regions"></div>
  <div id="map-controls" class="bar" hidden>
    <button id="all-repos" type="button">All repositories</button>
    <select id="repo" aria-label="Repository"></select>
    <input id="search" type="search" placeholder="Filter rooms by path" aria-label="Filter rooms by path">
    <span id="hits" class="mut"></span>
    <label><input id="links" type="checkbox"> region links (top 200)</label>
  </div>
  <div id="crumbs" class="bar" hidden></div>
  <p id="stats" class="mut"></p>
  <div id="legend"></div>
  <section id="agent-section" aria-labelledby="agent-locations-heading" hidden><h2 id="agent-locations-heading">Agent activity and last checkout files</h2><p class="mut">Numbered map rings mark last observed checkout files present in this generated snapshot; they do not establish where an agent is now.</p><div id="agent-locations"></div></section>
  <p id="action-status" role="status" class="mut"></p>
  <div id="map-layout" class="layout" hidden>
    <div><div class="stage"><canvas id="map"></canvas><details class="agent-map-shelf" open><summary>Agent entities · last known map locations</summary><div id="agent-map-entities"></div></details></div><div id="tip"></div></div>
    <aside id="panel"></aside>
  </div>
</main>
<script type="module" src="/worldmap.js"></script>
<script type="module" src="/site-nav.js" data-site-nav="allow"></script>
<script type="module" src="/messenger-widget.js" data-messenger="allow"></script>
</body>
</html>
