<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meowdoku</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #16161a; color: #e8e8ea; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; padding: 6px 10px;
         background: rgba(22,22,26,0.85); backdrop-filter: blur(6px); z-index: 2; flex-wrap: wrap; }
  #bar select, #bar button, #bar input[type=text] { background: #26262c; color: #e8e8ea; border: 1px solid #3a3a42; border-radius: 6px; padding: 5px 9px; font: inherit; }
  #bar button:hover { background: #30303a; }
  #bar label { display: inline-flex; gap: 6px; align-items: center; }
  #bar input[type=range] { width: 90px; }
  #status { margin-left: auto; opacity: 0.85; }
  /* The canvas starts below the control bar (which wraps to several lines on a
     phone) so the bar never covers the board; --bar-h is kept live below. */
  canvas { display: block; position: fixed; left: 0; top: var(--bar-h, 0px); width: 100vw;
           height: calc(100vh - var(--bar-h, 0px)); touch-action: none; }
  #word { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: none; gap: 6px; align-items: center; z-index: 2; }
  #word input { font: 22px/1 monospace; letter-spacing: 0.4em; text-transform: uppercase; width: 8.5em; text-align: center;
                background: #1e1e24; color: #f0f0f3; border: 1px solid #3a3a42; border-radius: 8px; padding: 6px 4px 6px 12px; }
  #word button { background: #26262c; color: #e8e8ea; border: 1px solid #3a3a42; border-radius: 6px; padding: 8px 12px; font: inherit; }
  #help { position: fixed; bottom: 8px; left: 12px; opacity: 0.6; font-size: 12px; }
  /* Scoped under #bar so they outrank "#bar label { display: inline-flex }". */
  .meowdoku-only, .wordle-only, .lichess-only, #bar .meowdoku-only, #bar .lichess-only { display: none; }
  body[data-game="meowdoku"] #bar .meowdoku-only { display: inline-flex; }
  body[data-game="lichess"] #bar .lichess-only { display: inline-flex; }
  body[data-game="wordle"] #word { display: flex; }
  #player { width: 9em; }
  #scores { position: fixed; right: 10px; top: calc(var(--bar-h, 0px) + 8px); z-index: 3; display: none; width: min(340px, calc(100vw - 20px));
            max-height: 70vh; overflow: auto; background: rgba(22,22,26,0.94); border: 1px solid #3a3a42; border-radius: 8px; padding: 10px 12px; }
  #scores.open { display: block; }
  #scores h3 { margin: 4px 0 6px; font-size: 13px; opacity: 0.8; font-weight: 600; }
  #scores table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #scores td { padding: 2px 4px; } #scores td.n { text-align: right; font-variant-numeric: tabular-nums; }
  #scores tr.me { color: #ffd76a; }
  #scores .muted { opacity: 0.6; font-size: 12px; }
</style>
</head>
<body data-game="meowdoku">
<div id="bar">
  <label>Game <select id="game"></select></label>
  <label class="meowdoku-only">Level <select id="level"></select></label>
  <label class="meowdoku-only">Board <select id="board"></select></label>
  <button id="new">New</button>
  <button id="undo">Undo (U)</button>
  <button id="reset">Reset (R)</button>
  <button id="lichess-stop" class="lichess-only">Stop Lichess after game</button>
  <button id="lichess-resume" class="lichess-only">Resume Lichess</button>
  <button id="light">Light: orbit (L)</button>
  <label>Tilt <input id="tilt" type="range" min="15" max="90" value="90"></label>
  <label>Saturation <input id="saturation" type="range" min="0" max="200" value="100"></label>
  <label>Round <input id="round" type="range" min="0" max="4" value="2"></label>
  <label>Crease <input id="crease" type="range" min="0" max="90" value="40"></label>
  <label>Player <input id="player" type="text" maxlength="24" placeholder="your name" autocomplete="nickname"></label>
  <button id="scores-toggle">Scores</button>
  <span id="status">loading…</span>
</div>
<div id="scores"></div>
<canvas id="gl"></canvas>
<div id="word">
  <input id="entry" type="text" maxlength="5" autocomplete="off" spellcheck="false" placeholder="word">
  <button id="enter">Enter</button>
  <button id="back">⌫</button>
</div>
<div id="help">meowdoku: tap or swipe for X, double-tap for a cat · chess/checkers: tap a piece, then a lit square · wordle: type or tap the rack · space_invaders: arrows or A/D move, space fires; on a phone hold a finger where the rocket should go</div>
<script>
  // Keep the canvas below the control bar as the bar wraps or unwraps.
  (() => { const bar = document.getElementById("bar");
    const fit = () => document.documentElement.style.setProperty("--bar-h", bar.offsetHeight + "px");
    new ResizeObserver(fit).observe(bar); fit(); })();
</script>
<script type="module" src="app.js"></script>
</body>
</html>
