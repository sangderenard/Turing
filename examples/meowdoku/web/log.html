<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meowdoku log</title>
<style>
  :root { --bg: #0c0e13; --fg: #d8dde6; --ctl: #1b2029; --line: #2c3340; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  button, input[type=search] { background: var(--ctl); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font: inherit; }
  label { display: inline-flex; gap: 4px; align-items: center; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  label.on { background: var(--ctl); }
  .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #top { padding: 6px 10px; background: #12151c; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  #panes { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); position: relative; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 5px 8px; background: #12151c; border-bottom: 1px solid var(--line); }
  .wrap { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  .thumb { position: absolute; right: 2px; width: 6px; border-radius: 3px; background: #556; opacity: .7; pointer-events: none; }
  .note { height: 18px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #8b93a3; font-size: 12px; padding: 0 8px; }
  #local-lines { flex: 1; margin: 0; padding: 8px; overflow: auto; white-space: pre; font: 12px/1.45 ui-monospace, Consolas, monospace; color: #d8dde6; }
  .msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #e88; font-size: 15px; display: none; text-align: center; }
  @media (max-width: 760px) { #panes { flex-direction: column; } .pane { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="top"><strong>Log</strong><span style="color:#8b93a3">server window (the ring behind /api/log) and local window (this browser)</span></div>
<div id="panes">
  <section class="pane" aria-label="server log"><div class="bar" id="bar"><strong>Server</strong><span id="srcs"></span>
    <input id="q" type="search" placeholder="search server" size="16" autocomplete="off">
    <button id="follow">Follow tail</button><button id="zoomout">A-</button><button id="zoomin">A+</button>
    <button id="copyvis">Copy visible</button><button id="copyall">Copy all</button><span id="stats"></span></div>
    <div class="wrap" id="wrap"><canvas id="c"></canvas><div class="thumb" id="thumb"></div><div class="msg" id="msg"></div></div>
    <div class="note" id="note"></div></section>
  <section class="pane" aria-label="client log"><div class="bar"><strong>Client (this browser)</strong>
    <input id="local-q" type="search" placeholder="search client" size="16" autocomplete="off">
    <button id="local-copy">Copy</button><button id="local-clear">Clear client log</button><span id="local-stats"></span></div>
    <pre id="local-lines" aria-live="polite"></pre></section>
</div>
<script type="module" src="log.js"></script>
</body>
</html>
