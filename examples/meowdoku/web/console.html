<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console · Meowdoku</title>
<style>
body{margin:0;background:#0b0e14;color:#e3e7f0;font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}main{max-width:1100px;margin:auto;padding:90px 16px 24px;display:flex;flex-direction:column;height:calc(100vh - 114px);box-sizing:border-box}
h1{font:600 18px/1.3 system-ui,sans-serif;margin:0 0 4px}.muted{color:#9aa6ba}#out{flex:1;overflow:auto;border:1px solid #2c3648;border-radius:8px;padding:10px 12px;background:#06080d;white-space:pre-wrap;overflow-wrap:anywhere;min-height:200px}
.cmd{color:#9fb8ff}.say{color:#e3e7f0}.err{color:#ff9f9f}.exit{color:#9fe0a8}.note{color:#9aa6ba}#out img{display:block;max-width:100%;max-height:60vh;margin:6px 0;border:1px solid #2c3648;border-radius:4px}
form{display:flex;gap:8px;margin-top:10px}#line{flex:1;font:inherit;color:inherit;background:#141a26;border:1px solid #4a5a74;border-radius:6px;padding:8px}#line:focus-visible,button:focus-visible{outline:2px solid #a7c7ff;outline-offset:2px}
button{font:inherit;color:inherit;background:#1b2332;border:1px solid #60728c;border-radius:6px;padding:8px 12px;cursor:pointer}[hidden]{display:none!important}
@media(max-width:700px){main{padding:110px 10px 16px;height:calc(100vh - 126px)}}
</style></head><body>
<main><h1>Console</h1><p class="muted" id="intro">A text console over the site's own walking verbs. Type <b>help</b>.</p>
<div id="out" role="log" aria-live="polite"></div>
<form id="form" hidden><label for="line" class="muted" style="align-self:center">&gt;</label><input id="line" autocomplete="off" spellcheck="false" aria-label="Command"><button type="submit">Do</button></form>
</main>
<script type="module" src="/console.js"></script>
<script type="module" src="/site-nav.js" data-site-nav="allow"></script>
</body></html>
