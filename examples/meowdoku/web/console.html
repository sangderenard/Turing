<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console · Meowdoku</title>
<style>
body{margin:0;background:#0b0e14;color:#e3e7f0;font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}main{max-width:1100px;margin:auto;padding:90px 16px 24px;display:flex;flex-direction:column;height:calc(100vh - 114px);box-sizing:border-box}
h1{font:600 18px/1.3 system-ui,sans-serif;margin:0 0 4px}.muted{color:#9aa6ba}#out{flex:1;overflow:auto;border:1px solid #2c3648;border-radius:8px;padding:10px 12px;background:#06080d;white-space:pre-wrap;overflow-wrap:anywhere;min-height:200px}
.cmd{color:#9fb8ff}.say{color:#e3e7f0}.err{color:#ff9f9f}.exit{color:#9fe0a8}.note{color:#9aa6ba}#out img{display:block;max-width:100%;max-height:60vh;margin:6px 0;border:1px solid #2c3648;border-radius:4px}
form{display:flex;gap:8px;margin-top:10px}#line{flex:1;font:inherit;color:inherit;background:#141a26;border:1px solid #4a5a74;border-radius:6px;padding:8px}#line:focus-visible,button:focus-visible{outline:2px solid #a7c7ff;outline-offset:2px}
button{font:inherit;color:inherit;background:#1b2332;border:1px solid #60728c;border-radius:6px;padding:8px 12px;cursor:pointer}[hidden]{display:none!important}
#orient{border:1px solid #2c3648;border-radius:8px;padding:6px 12px;margin-bottom:10px;background:#0f1420}#orient summary{cursor:pointer;font:600 14px/1.6 system-ui,sans-serif}#orient p{margin:4px 0 8px}
.orow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}.orow label{display:flex;gap:6px;align-items:center}.orow select,.orow input{font:inherit;color:inherit;background:#141a26;border:1px solid #4a5a74;border-radius:6px;padding:6px}.orow input{width:9em}.orow button{padding:6px 10px}#orient-status{flex-basis:100%;overflow-wrap:anywhere}
@media(max-width:700px){main{padding:110px 10px 16px;height:calc(100vh - 126px)}}
</style></head><body>
<main><h1>Console</h1><p class="muted" id="intro">A text console over the site's own walking verbs. Type <b>help</b>.</p>
<details id="orient" hidden><summary>Agent orientation</summary>
<p class="muted">Every markdown file of the core's repositories, in causal order: links in the order they appear, from each AGENTS.md; history for the rest. Filters and your place are kept on your account.</p>
<div class="orow"><label>Repository <select id="orient-repository"><option value="">all</option></select></label>
<label>Kind <select id="orient-kind"><option value="">all</option></select></label>
<label>Path starts <input id="orient-prefix" autocomplete="off" spellcheck="false" placeholder="docs/"></label>
<label>Path contains <input id="orient-keyword" autocomplete="off" spellcheck="false" placeholder="handoff"></label>
<button id="orient-apply" type="button">Apply</button><button id="orient-clear" type="button">Clear</button></div>
<div class="orow"><button id="orient-first" type="button">First</button><button id="orient-prev" type="button">Previous</button><button id="orient-next" type="button">Next</button><button id="orient-last" type="button">Last</button><button id="orient-examine" type="button">Read</button>
<span id="orient-status" class="muted" role="status" aria-live="polite"></span></div></details>
<div id="out" role="log" aria-live="polite"></div>
<form id="form" hidden><label for="line" class="muted" style="align-self:center">&gt;</label><input id="line" autocomplete="off" spellcheck="false" aria-label="Command"><button type="submit">Do</button></form>
</main>
<script type="module" src="/console.js"></script>
<script type="module" src="/site-nav.js" data-site-nav="allow"></script>
</body></html>
