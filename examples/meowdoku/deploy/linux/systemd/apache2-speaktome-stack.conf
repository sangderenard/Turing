# /etc/systemd/system/apache2.service.d/speaktome-stack.conf -- installed with deploy/apache/oracle-stack.conf.
# httpd closing the supervisor pipe is the stack stop. The supervisor then stops its instances gracefully (20 s each
# at most) and exits by itself; a restarting supervisor waits for its lock before starting any. KillMode=mixed (the
# unit default) SIGKILLs the supervisor the moment httpd exits, mid-stop (seen on Oracle 2026-11-21), so systemd stops
# only httpd here.
[Service]
KillMode=process
TimeoutStopSec=60
