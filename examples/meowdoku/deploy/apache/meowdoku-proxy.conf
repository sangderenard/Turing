# Meowdoku behind Apache 2.4 (HTTPS front on 443) -- vhost fragment.
# Applied copy of the repo fragment (Include conf/meowdoku-proxy.conf from httpd.conf).  Tested against the Apache Lounge 2.4.58 build's module set (mod_proxy_wstunnel present).
#
# Required in httpd.conf (uncomment / add; paths as in C:/Apache24/conf/httpd.conf):
#   LoadModule proxy_module            modules/mod_proxy.so
#   LoadModule proxy_http_module       modules/mod_proxy_http.so
#   LoadModule proxy_wstunnel_module   modules/mod_proxy_wstunnel.so
#   LoadModule proxy_balancer_module   modules/mod_proxy_balancer.so
#   LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
#   LoadModule slotmem_shm_module      modules/mod_slotmem_shm.so
#   LoadModule ssl_module              modules/mod_ssl.so
#   LoadModule headers_module          modules/mod_headers.so
#   LoadModule rewrite_module          modules/mod_rewrite.so
# Plus, once, at the end of httpd.conf (and `Listen 443`):
#   Include "C:/dev/Powershell/turing/examples/meowdoku/deploy/apache/meowdoku-proxy.conf"
#
# WebSocket: 2.4.58 supports the `upgrade=websocket` ProxyPass option (2.4.47+), which makes mod_proxy_http tunnel an
# Upgrade request itself, so no RewriteCond on the Upgrade header is needed.  /ws and /ws/spectate get their own ProxyPass
# lines (more specific first).  On Apache older than 2.4.47 replace them with:
#   RewriteEngine On
#   RewriteCond %{HTTP:Upgrade} =websocket [NC]
#   RewriteRule ^/(ws(/spectate)?)$ wss://127.0.0.1:8766/$1 [P,L]
#
# Stickiness: a game table lives in ONE python process (cookie meowdoku_session is per-process), so every client must keep
# hitting the same instance.  The balancer sets MEOWDOKU_ROUTE=<route> (stickysession=MEOWDOKU_ROUTE|meowdoku_route); each
# instance may also set a `meowdoku_route=<route>` cookie itself (proxy_trust.route_cookie).
#
# Backend TLS: instances serve their own self-signed cert (build/meowdoku/tls/cert.pem, CA build/meowdoku/tls/ca.crt per
# HOW_TO_START.md).  The CA is pinned below.  The cert is issued for the public name / IP, not 127.0.0.1, so peer-name
# checking is off; trust still rests on the pinned CA, and the backends are loopback-only (--bind 127.0.0.1).
#
# No DocumentRoot / htdocs change: everything below is proxied.

<VirtualHost *:443>
    # Public IP from build/meowdoku/access.json (cert SANs: 192.168.1.232, 192.168.138.133, 127.0.0.1, localhost)
    ServerName stichka.duckdns.org

    SSLEngine on
    # Same cert the clients already see on 8766
    SSLCertificateFile    "C:/Users/alber/AppData/Local/Posh-ACME/LE_PROD/3981975032/stichka.duckdns.org/fullchain.cer"
    SSLCertificateKeyFile "C:/Users/alber/AppData/Local/Posh-ACME/LE_PROD/3981975032/stichka.duckdns.org/cert.key"

    # Lifecycle: httpd starts this piped log program at startup, restarts it if it exits and closes its stdin at shutdown.  It writes the
    # access log to build/meowdoku/logs/apache-access.log and owns the Meowdoku/Nodus instances (deploy/instances.json).
    CustomLog "|\"C:/dev/Powershell/srv/python/python.exe\" \"C:/dev/Powershell/turing/examples/meowdoku/deploy/apache_supervisor.py\"" combined
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # X-Forwarded-For: left to mod_proxy's default (it appends the client address).

    SSLProxyEngine On
    SSLProxyCACertificateFile "C:/dev/Powershell/turing/build/meowdoku/tls/ca.crt"
    SSLProxyVerify require
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerCN off

    # Admin stays loopback-direct and is NOT proxied: the server refuses forwarded admin requests anyway.
    ProxyPass        /api/admin !
    ProxyPass        /api/admin/ !

    # ---- Variant A: balancer (one or more instances) -- the default.  Use EITHER A or B, not both.
    <Proxy "balancer://meowdoku">
        BalancerMember "https://127.0.0.1:8766" route=a upgrade=websocket
        # route b (the Development server, 8768) is NOT a balancer member: the rewrite rules below send only dev_ui accounts' cookie-selected
        # traffic there, so no anonymous request can ever be balanced onto it.
        ProxySet stickysession=MEOWDOKU_ROUTE|meowdoku_route
        ProxySet lbmethod=byrequests
    </Proxy>
    # Cookie the balancer issues so the browser sticks to a member (route name appended by mod_proxy).
    Header add Set-Cookie "MEOWDOKU_ROUTE=.%{BALANCER_WORKER_ROUTE}e; path=/; Secure; HttpOnly" env=BALANCER_ROUTE_CHANGED

    # [ROUTE] Stable server (8766, route a) vs Development server (8768, route b).  Every request is proxied by a RewriteRule [P] (no ProxyPass
    # for /: when ProxyPass and RewriteRule both match, mod_proxy's own translate hook can pre-empt the rule, so one mechanism owns the mapping).
    # The cookie meowdoku_route=b (set only by POST /api/route or by login for an account whose stored preference is dev; the dev instance itself
    # refuses non-dev_ui accounts with 403 and resets the cookie) selects the Development server; everything else goes to the balancer (member a).
    # upgrade=websocket is a worker parameter, so it sits on the BalancerMember (not accepted on balancer:// ProxyPass).
    RewriteEngine On
    RewriteRule ^/api/admin(/|$) - [L]
    RewriteCond %{HTTP_COOKIE} (^|;\s*)meowdoku_route=b(;|$)
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(ws(/spectate)?)$ wss://127.0.0.1:8768/$1 [P,L]
    RewriteCond %{HTTP_COOKIE} (^|;\s*)meowdoku_route=b(;|$)
    RewriteRule ^/(.*)$ https://127.0.0.1:8768/$1 [P,L]
    RewriteRule ^/(.*)$ balancer://meowdoku/$1 [P,L]
    ProxyPassReverse /     https://127.0.0.1:8766/
    ProxyPassReverse /     https://127.0.0.1:8768/

    # ---- Variant B: single-instance.  Delete variant A's <Proxy>/Header/ProxyPass lines and use these instead:
    # ProxyPass /ws/spectate https://127.0.0.1:8766/ws/spectate upgrade=websocket
    # ProxyPass /ws          https://127.0.0.1:8766/ws          upgrade=websocket
    # ProxyPass /            https://127.0.0.1:8766/
    # ProxyPassReverse /     https://127.0.0.1:8766/
</VirtualHost>

# Port 80: never serve the old htdocs; send everyone to the HTTPS front.
<VirtualHost *:80>
    ServerName stichka.duckdns.org
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>
