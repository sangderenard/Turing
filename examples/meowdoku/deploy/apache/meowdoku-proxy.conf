# Meowdoku behind Apache 2.4 (HTTPS front on 443) -- vhost fragment.
# Applied copy of the repo fragment (Include conf/meowdoku-proxy.conf from httpd.conf).  Tested against the Apache Lounge 2.4.58 build's module set (mod_proxy_wstunnel present).
#
# Required in httpd.conf (uncomment / add; paths as in C:/Apache24/conf/httpd.conf):
#   LoadModule proxy_module            modules/mod_proxy.so
#   LoadModule proxy_http_module       modules/mod_proxy_http.so
#   LoadModule proxy_wstunnel_module   modules/mod_proxy_wstunnel.so
#   LoadModule proxy_balancer_module   modules/mod_proxy_balancer.so
#   LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
#   LoadModule slotmem_shm_module      modules/mod_slotmem_shm.so
#   LoadModule ssl_module              modules/mod_ssl.so
#   LoadModule headers_module          modules/mod_headers.so
#   LoadModule rewrite_module          modules/mod_rewrite.so
# Plus, once, at the end of httpd.conf (and `Listen 443`):
#   Include "C:/dev/Powershell/turing/examples/meowdoku/deploy/apache/meowdoku-proxy.conf"
#
# WebSocket: 2.4.58 supports the `upgrade=websocket` ProxyPass option (2.4.47+), which makes mod_proxy_http tunnel an
# Upgrade request itself, so no RewriteCond on the Upgrade header is needed.  /ws and /ws/spectate get their own ProxyPass
# lines (more specific first).  On Apache older than 2.4.47 replace them with:
#   RewriteEngine On
#   RewriteCond %{HTTP:Upgrade} =websocket [NC]
#   RewriteRule ^/(ws(/spectate)?)$ wss://127.0.0.1:8766/$1 [P,L]
#
# Stickiness: a game table lives in ONE python process (cookie meowdoku_session is per-process), so every client must keep
# hitting the same instance.  The balancer sets MEOWDOKU_ROUTE=<route> (stickysession=MEOWDOKU_ROUTE|meowdoku_route); each
# instance may also set a `meowdoku_route=<route>` cookie itself (proxy_trust.route_cookie).
#
# Backend TLS: instances serve their own self-signed cert (build/meowdoku/tls/cert.pem, CA build/meowdoku/tls/ca.crt per
# HOW_TO_START.md).  The CA is pinned below.  The cert is issued for the public name / IP, not 127.0.0.1, so peer-name
# checking is off; trust still rests on the pinned CA, and the backends are loopback-only (--bind 127.0.0.1).
#
# No DocumentRoot / htdocs change: everything below is proxied.

# Global server identity: vhost ServerName does not suppress AH00558.
# This names the server; DuckDNS updates and public port forwarding stay separate.
ServerName stichka.duckdns.org

# Shared header injection uses Apache's standard response filters. Keep these
# guarded loads here so deploying this fragment requires no httpd.conf edit.
<IfModule !filter_module>
    LoadModule filter_module modules/mod_filter.so
</IfModule>
<IfModule !substitute_module>
    LoadModule substitute_module modules/mod_substitute.so
</IfModule>

<VirtualHost *:443>
    # Public IP from build/meowdoku/access.json (cert SANs: 192.168.1.232, 192.168.138.133, 127.0.0.1, localhost)
    ServerName stichka.duckdns.org

    SSLEngine on
    # Same cert the clients already see on 8766. Apache runs as the service account, which never reads the operator's profile
    # (Posh-ACME keeps the originals under C:/Users/alber): these are the copies Copy-PublicCertificate.ps1 writes to
    # srv/state/secrets/tls-public, readable by the service (Setup-ServiceAccount.ps1). Recopy after each renewal.
    SSLCertificateFile    "C:/dev/Powershell/srv/state/secrets/tls-public/fullchain.cer"
    SSLCertificateKeyFile "C:/dev/Powershell/srv/state/secrets/tls-public/cert.key"

    # Lifecycle: httpd starts this piped log program at startup, restarts it if it exits and closes its stdin at shutdown.  It writes the
    # access log to build/meowdoku/logs/apache-access.log and owns the Meowdoku/Nodus instances (deploy/instances.json).
    # Path only: OAuth callback query and Referer may contain authorization secrets.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" meowdoku_safe
    CustomLog "|\"C:/dev/Powershell/srv/python/python.exe\" \"C:/dev/Powershell/turing/examples/meowdoku/deploy/apache_supervisor.py\"" meowdoku_safe
    # BEGIN shared site navigation filter
    # Only ordinary HTML documents are changed. API/WebSocket, attachments and
    # encoded responses retain their bytes; the backend currently serves HTML
    # uncompressed. Keep compression, if introduced, AFTER this filter.
    # The exact existing module URL deliberately has no cache-busting query:
    # ES module identity makes authored + injected tags execute only once.
    FilterDeclare MEOWDOKU_SITE_NAV
    FilterProvider MEOWDOKU_SITE_NAV SUBSTITUTE "%{CONTENT_TYPE} =~ m#^text/html(?:;|$)#i && %{REQUEST_URI} !~ m#^/(?:api|ws)(?:/|$)# && -z resp('Content-Encoding') && -z resp('Content-Disposition')"
    FilterChain +MEOWDOKU_SITE_NAV
    FilterProtocol MEOWDOKU_SITE_NAV SUBSTITUTE change=yes;byteranges=no
    Substitute "s|</body>|<script type='module' src='/site-nav.js' data-site-nav='allow'></script></body>|i"
    # Default limit is 1 MB per line; a longer line aborts the response (AH01328) and the browser gets a
    # truncated page. The MechanicalCreature living map carries its model on one ~14.4 MB line.
    SubstituteMaxLineLength 32m
    # END shared site navigation filter

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # X-Forwarded-For: left to mod_proxy's default (it appends the client address).

    SSLProxyEngine On
    SSLProxyCACertificateFile "C:/dev/Powershell/turing/build/meowdoku/tls/ca.crt"
    SSLProxyVerify require
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerCN off

    # Admin stays loopback-direct and is NOT proxied: the server refuses forwarded admin requests anyway.
    ProxyPass        /api/admin !
    ProxyPass        /api/admin/ !

    # ---- Variant A: balancer (one or more instances) -- the default.  Use EITHER A or B, not both.
    <Proxy "balancer://meowdoku">
        BalancerMember "https://127.0.0.1:8766" route=a upgrade=websocket
        # route b (the Development server, 8768) is NOT a balancer member: the rewrite rules below send only dev_ui accounts' cookie-selected
        # traffic there, so no anonymous request can ever be balanced onto it.
        ProxySet stickysession=MEOWDOKU_ROUTE|meowdoku_route
        ProxySet lbmethod=byrequests
    </Proxy>
    # Cookie the balancer issues so the browser sticks to a member (route name appended by mod_proxy).
    Header add Set-Cookie "MEOWDOKU_ROUTE=.%{BALANCER_WORKER_ROUTE}e; path=/; Secure; HttpOnly" env=BALANCER_ROUTE_CHANGED

    # BEGIN site condition
    # [CONDITION] The site's skin. A card posted in ${MEOWDOKU_CONDITION} turns every new request away here, before routing,
    # pacing or any backend: red.on (under genuine threat, or down) is read before yellow.on (under mild attack).  Apache
    # tests the file on each request, so posting or taking down a card (deploy/Set-SiteCondition.ps1) needs no restart.  An
    # open WebSocket tunnel is not cut; it lasts until its client or backend closes it.  With no card posted, a backend that
    # cannot be reached also answers with the red card (the ErrorDocument default below).  The cards themselves are copied
    # from deploy/apache/condition by Set-SiteCondition.ps1 or the operators' switch (site_condition.py).
    # tests/test_meowdoku_apache_condition.py runs this block.
    <IfDefine !MEOWDOKU_CONDITION>
        Define MEOWDOKU_CONDITION "C:/dev/Powershell/srv/state/condition"
    </IfDefine>
    Alias "/_condition/" "${MEOWDOKU_CONDITION}/"
    <Directory "${MEOWDOKU_CONDITION}">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    <Location "/_condition/">
        # The cards are whole pages: no shared navigation, and never cached past the card being taken down.
        FilterChain !
        Header always set Cache-Control "no-store"
    </Location>
    SetEnvIf Request_URI "^" MEOWDOKU_CARD=red
    ErrorDocument 503 /_condition/%{reqenv:MEOWDOKU_CARD}.html
    Header always set Retry-After "300" env=REDIRECT_MEOWDOKU_POSTED
    RewriteEngine On
    RewriteRule ^/_condition/(yellow|red)\.html$ - [L]
    # The flag files and anything else in the folder are not served.
    RewriteRule ^/_condition/ - [F,L]
    # The operators' switch (site_condition.py) passes a posted card, so the card can be taken down from the card. The server
    # answers it only to an operator or an admin; the courtesy pacing below still applies to it.
    RewriteRule ^/api/condition(/controls\.js)?$ - [S=2]
    RewriteCond "${MEOWDOKU_CONDITION}/red.on" -f
    RewriteRule ^ - [R=503,L,E=MEOWDOKU_CARD:red,E=MEOWDOKU_POSTED:red]
    RewriteCond "${MEOWDOKU_CONDITION}/yellow.on" -f
    RewriteRule ^ - [R=503,L,E=MEOWDOKU_CARD:yellow,E=MEOWDOKU_POSTED:yellow]
    # END site condition

    # [ROUTE] Stable server (8766, route a) vs Development server (8768, route b).  Every request is proxied by a RewriteRule [P] (no ProxyPass
    # for /: when ProxyPass and RewriteRule both match, mod_proxy's own translate hook can pre-empt the rule, so one mechanism owns the mapping).
    # The cookie meowdoku_route=b (set only by POST /api/route or by login for an account whose stored preference is dev; the dev instance itself
    # refuses non-dev_ui accounts with 403 and resets the cookie) selects the Development server; everything else goes to the balancer (member a).
    # upgrade=websocket is a worker parameter, so it sits on the BalancerMember (not accepted on balancer:// ProxyPass).
    RewriteEngine On
    RewriteRule ^/api/admin(/|$) - [L]
    # MCP sessions, registration, token exchange and browser consent share the stable instance's OAuth store.
    # A browser's development-route cookie must not split one authorization flow across two stores.
    RewriteRule ^/(mcp(/guest)?|oauth(/.*)?|\.well-known/oauth-protected-resource/mcp|\.well-known/oauth-authorization-server)$ https://127.0.0.1:8766/$1 [P,L]
    # [LINK] Nodus link sockets (case 98d49cb8): wss://<host>/ws/link/<prefix>/{control,bulk} go straight to the native
    # link listener on loopback; its tickets come from POST /api/link/ticket/<prefix>. Above the route-b cookie rules.
    <IfDefine !MEOWDOKU_LINK_UPSTREAM>
        Define MEOWDOKU_LINK_UPSTREAM "127.0.0.1:47616"
    </IfDefine>
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws/link/([A-Za-z0-9._-]+)/(control|bulk)$ ws://${MEOWDOKU_LINK_UPSTREAM}/ws/link/$1/$2 [P,L]
    # [DEV] With `Define MEOWDOKU_DEV_APACHE` (set beside the Include of this file), the dev route goes to the dev site's own
    # Apache (dev-proxy.conf, 127.0.0.1:8443), which hosts the dev server and every ready branch server. Without it,
    # nothing changes: the dev route goes straight to the dev server as before. Research case 8bbe0de7, Stage 5.
    # [REMOTE] MEOWDOKU_DEV_UPSTREAM is where the dev Apache listens: 127.0.0.1:8443 unless defined beside the Include (for
    # example `Define MEOWDOKU_DEV_UPSTREAM 192.168.1.232:8443`, when the dev side is run as a remote partner).
    <IfDefine MEOWDOKU_DEV_APACHE>
        <IfDefine !MEOWDOKU_DEV_UPSTREAM>
            Define MEOWDOKU_DEV_UPSTREAM "127.0.0.1:8443"
        </IfDefine>
        RewriteCond %{HTTP_COOKIE} (^|;\s*)meowdoku_route=b(;|$)
        RewriteCond %{HTTP:Upgrade} =websocket [NC]
        RewriteRule ^/(ws(/spectate)?)$ wss://${MEOWDOKU_DEV_UPSTREAM}/$1 [P,L]
        RewriteCond %{HTTP_COOKIE} (^|;\s*)meowdoku_route=b(;|$)
        RewriteRule ^/(.*)$ https://${MEOWDOKU_DEV_UPSTREAM}/$1 [P,L]
        ProxyPassReverse /     https://${MEOWDOKU_DEV_UPSTREAM}/
    </IfDefine>
    RewriteCond %{HTTP_COOKIE} (^|;\s*)meowdoku_route=b(;|$)
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(ws(/spectate)?)$ wss://127.0.0.1:8768/$1 [P,L]
    RewriteCond %{HTTP_COOKIE} (^|;\s*)meowdoku_route=b(;|$)
    RewriteRule ^/(.*)$ https://127.0.0.1:8768/$1 [P,L]
    RewriteRule ^/(.*)$ balancer://meowdoku/$1 [P,L]
    ProxyPassReverse /     https://127.0.0.1:8766/
    ProxyPassReverse /     https://127.0.0.1:8768/

    # ---- Variant B: single-instance.  Delete variant A's <Proxy>/Header/ProxyPass lines and use these instead:
    # ProxyPass /ws/spectate https://127.0.0.1:8766/ws/spectate upgrade=websocket
    # ProxyPass /ws          https://127.0.0.1:8766/ws          upgrade=websocket
    # ProxyPass /            https://127.0.0.1:8766/
    # ProxyPassReverse /     https://127.0.0.1:8766/
</VirtualHost>

# Port 80: never serve the old htdocs; send everyone to the HTTPS front.
<VirtualHost *:80>
    ServerName stichka.duckdns.org
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>
