<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>We are under genuine threat, or down</title>
<!-- [CONDITION] The red card (deploy/Set-SiteCondition.ps1 -Red). Apache answers every new request with this page and
     503 while it is posted, and also when a backend cannot be reached and no card is posted. Self-contained. -->
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #b00020; color: #fff;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 34rem; padding: 2rem 1.25rem; }
  .mark { font-size: 4rem; line-height: 1; }
  h1 { font-size: clamp(1.9rem, 6vw, 3rem); line-height: 1.1; margin: 1rem 0 0.75rem; letter-spacing: -0.02em; }
  p { margin: 0.6rem 0; }
  .small { font-size: 0.95rem; opacity: 0.8; margin-top: 1.5rem; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">🟥</div>
  <h1>We are under genuine threat, or we are down</h1>
  <p>The site has closed itself off to stay safe. No one is getting in right now.</p>
  <p class="small">Please come back later.</p>
</main>
</body>
</html>
