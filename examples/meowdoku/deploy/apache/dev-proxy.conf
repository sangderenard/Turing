# [DEV] The dev site's own Apache (Stages 4 and 5 of Research case 8bbe0de7).
#
# A second httpd: it is not a Windows service, listens only on 127.0.0.1, and has no port below 1024 and no firewall
# rule. The supervisor runs it as an ordinary instance (kind "command"), so an operator restarts it through
# instance control, with no elevation and without touching stable's Apache:
#
#   {"name": "dev-apache", "kind": "command", "port": null, "account": "svc-meowdoku-dev",
#    "args": ["C:/Apache24/bin/httpd.exe", "-f", "C:/dev/Powershell/turing/examples/meowdoku/deploy/apache/dev-proxy.conf"]}
#
# Stable's Apache stays the only public front. With `Define MEOWDOKU_DEV_APACHE` in its configuration, it sends the dev
# route (cookie meowdoku_route=b) here instead of straight to the dev server (meowdoku-proxy.conf). From here:
#   - a request carrying meowdoku_loan=<port> goes to that branch server, but only when loans.map lists the port as
#     ready (branch_servers.py rewrites the map on every loans.refresh; a txt map is reread when its time changes);
#   - everything else goes to the dev server (8768).
# Every branch server and the dev server require dev_ui themselves (--require-cap dev_ui), so this proxy adds no access.

Define DEV_LISTEN      "127.0.0.1:8443"
Define DEV_SERVER      "127.0.0.1:8768"
Define DEV_STATE       "C:/dev/Powershell/srv/state-dev"
Define LOANS_MAP       "C:/dev/Powershell/srv/state-loans/loans.map"
Define LOOPBACK_TLS    "C:/dev/Powershell/turing/build/meowdoku/tls"

ServerRoot "C:/Apache24"
Listen ${DEV_LISTEN}
PidFile "${DEV_STATE}/run/dev-apache.pid"
ErrorLog "${DEV_STATE}/logs/dev-apache-error.log"
LogLevel warn
ServerName 127.0.0.1

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so

# The access log keeps no client address: the same safe format as stable's (meowdoku-proxy.conf).
LogFormat "%t \"%m %U %H\" %>s %b" dev_safe
CustomLog "${DEV_STATE}/logs/dev-apache-access.log" dev_safe

SSLSessionCache "shmcb:${DEV_STATE}/run/dev-apache-ssl(512000)"

<VirtualHost ${DEV_LISTEN}>
    SSLEngine on
    SSLCertificateFile    "${LOOPBACK_TLS}/cert.pem"
    SSLCertificateKeyFile "${LOOPBACK_TLS}/key.pem"

    ProxyPreserveHost On
    SSLProxyEngine On
    SSLProxyCACertificateFile "${LOOPBACK_TLS}/ca.crt"
    SSLProxyVerify require
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerCN off

    RewriteEngine On
    RewriteMap loans "txt:${LOANS_MAP}"
    # The loopback token endpoints are never proxied, here as on stable.
    RewriteRule ^/api/admin(/|$) - [F,L]

    # A ready branch server: the LAST condition captures the port (a back-reference is the last matched condition's),
    # and it matches only when the map says that port is ready.
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP_COOKIE} (?:^|;\s*)meowdoku_loan=(\d{4})(?:;|$)
    RewriteCond ${loans:%1|none}#%1 ^ready#(\d{4})$
    RewriteRule ^/(ws(/spectate)?)$ wss://127.0.0.1:%1/$1 [P,L]
    RewriteCond %{HTTP_COOKIE} (?:^|;\s*)meowdoku_loan=(\d{4})(?:;|$)
    RewriteCond ${loans:%1|none}#%1 ^ready#(\d{4})$
    RewriteRule ^/(.*)$ https://127.0.0.1:%1/$1 [P,L]

    # Everything else: the dev server.
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(ws(/spectate)?)$ wss://${DEV_SERVER}/$1 [P,L]
    RewriteRule ^/(.*)$ https://${DEV_SERVER}/$1 [P,L]
    ProxyPassReverse / https://${DEV_SERVER}/
</VirtualHost>
