# oracle-stack.conf -- Apache owns the SpeakToMe stack's lifecycle on the Linux host, as it does on Windows.
#
# The supervisor (deploy/apache_supervisor.py) is Apache's piped access-log program: httpd starts it at startup,
# restarts it if it exits, and closes its stdin at shutdown, which is the supervisor's signal to stop every instance
# gracefully. So `systemctl stop|start|restart apache2` is the stack's stop|start|restart (stm.sh stop|start|restart).
# systemd must stop only httpd (deploy/linux/systemd/apache2-speaktome-stack.conf: KillMode=process): the unit's
# default KillMode=mixed SIGKILLs the supervisor the moment httpd exits, in the middle of its graceful stop. A restarting
# supervisor waits for the old one's lock before it starts anything. A graceful reload restarts piped loggers too, so
# `systemctl reload apache2` restarts the instances.
#
# Proven on the Oracle A1 host 2026-11-21 (test state): supervisor and server run as nodus, no root process; stop is
# "stopping instances" -> "stopped" in 3 s with nothing left; restart hands over through the lock (1 supervisor, 1 server).
#
# Piped log programs inherit httpd's root identity on Linux; setpriv drops to the service account before Python starts,
# so nothing of the stack runs as root (owner, 2026-11-10: not as a person, not a system-wide resource).
#
# Install (as root): cp deploy/apache/oracle-stack.conf /etc/apache2/conf-available/ && a2enconf oracle-stack
#   cp deploy/linux/systemd/apache2-speaktome-stack.conf /etc/systemd/system/apache2.service.d/speaktome-stack.conf
#   systemctl daemon-reload && systemctl restart apache2
# The instances, the state root and the interpreter are named below; change them here, not in the supervisor.

Define SPEAKTOME_STACK_PYTHON    "/srv/powershell/srv/service-venv/bin/python"
Define SPEAKTOME_STACK_TURING    "/srv/powershell/turing"
Define SPEAKTOME_STACK_STATE     "/srv/powershell/srv/state"
Define SPEAKTOME_STACK_INSTANCES "/srv/powershell/turing/examples/meowdoku/deploy/linux/instances.json"

# A plain "|" makes httpd start setpriv directly (no shell left running as root); setpriv then execs Python.
CustomLog "|/usr/bin/setpriv --reuid=nodus --regid=nodus --init-groups --reset-env -- ${SPEAKTOME_STACK_PYTHON} ${SPEAKTOME_STACK_TURING}/examples/meowdoku/deploy/apache_supervisor.py --instances ${SPEAKTOME_STACK_INSTANCES} --state-dir ${SPEAKTOME_STACK_STATE}" combined
