# oracle-front.conf -- the Oracle A1 host's Apache front for speaktome.dev (Ubuntu, Apache 2.4.58).
#
# Owner, 2026-11-21: "Oracle to host itself on one sub domain and proxy my odd port at home to a simple subdomain, and so
# too providing for modal a subdomain".
#
#   speaktome.dev         -> this host's own SpeakToMe: the repository's server, run by the stack (oracle-stack.conf),
#                            on its own state root (owner, 2026-11-26: "run the repo there"). Oracle's accounts
#                            propagating back to home (the Nodus mesh model) is separate, later work.
#   www.speaktome.dev     -> a permanent redirect to speaktome.dev.
#   home.speaktome.dev    -> the home server's public port (https://stichka.duckdns.org:8766, Apache there), WebSockets
#                            included. Home keeps its own accounts; Oracle only relays.
#   oracle.speaktome.dev  -> Oracle's own SpeakToMe. Until the accounts database moves here (owner's go), this answers
#                            the not-yet page: a public sign-up on Oracle's test state would be a second identity
#                            authority.
#   modal.speaktome.dev   -> the Modal operator's front (deploy/modal/front_app.py), behind a shared front token.
#
# The :443 vhosts are written here, not by certbot's installer: certbot puts its copy in oracle-front-le-ssl.conf,
# which Apache reads BEFORE this file, so the Define lines below were not yet defined there (2026-11-21).
#
# Install (as root):
#   cp -r deploy/apache/condition/. /var/www/speaktome-condition/
#   cp deploy/apache/oracle-front.conf /etc/apache2/sites-available/ && a2ensite oracle-front
#   a2enmod proxy proxy_http proxy_wstunnel ssl headers rewrite
# Adding names to a live host goes in this order (review 7e5f6873: codex 713/755, claude 756). certbot's webroot
# challenge for a new name needs that name's :80 alias LIVE first, so the HTTP reload comes before the certificate:
#   1. Run apache2ctl -S and confirm home.speaktome.dev is the effective default server for *:443.
#   2. apache2ctl configtest && systemctl reload apache2      (deploy/linux/stm.sh front installs, tests, reloads)
#      The new :443 vhosts load on the old certificate. Their names fail TLS until certificate expansion.
#   3. Paste this block after the HTTP reload succeeds. For a first install, omit --expand.
#      if (
#        webroot=/var/www/speaktome-condition
#        d="$webroot/.well-known/acme-challenge"
#        install -d "$d" || exit 1
#        probe=$(mktemp "$d/probe.XXXXXXXX") || exit 1
#        trap 'rm -f -- "$probe"' EXIT
#        printf '%s\n' "${probe##*/}" > "$probe" || exit 1
#        chmod 0644 "$probe" || exit 1
#        for n in speaktome.dev www.speaktome.dev; do
#          reply=$(curl -fsS "http://$n/.well-known/acme-challenge/${probe##*/}") &&
#            [ "$reply" = "${probe##*/}" ] || { printf 'Challenge failed on %s\n' "$n" >&2; exit 1; }
#        done
#        rm -f -- "$probe" || exit 1
#      ); then
#        certbot certonly --webroot -w /var/www/speaktome-condition --cert-name home.speaktome.dev --expand \
#          -d home.speaktome.dev -d oracle.speaktome.dev -d modal.speaktome.dev -d speaktome.dev -d www.speaktome.dev
#      else
#        printf 'ACME checks failed. Certificate expansion skipped.\n' >&2
#      fi
#   4. After Certbot succeeds, run apache2ctl configtest && systemctl reload apache2.
#      Run apache2ctl -S again. Stop if the effective *:443 default server is not home.speaktome.dev.
#   5. Verify www returns 301 to https://speaktome.dev/. Send a distinct query ID to each of apex and home.
#      Confirm the apex ID appears in the Oracle stack access log and the home ID in the home server access log.
#      Check that both public responses succeed.
# Renewal is certbot's own timer through the same webroot; the :80 vhost below lets the challenge through.
#
# The Modal front's shared token (review e14e5e55, operator-codex: the token must be provisioned, not assumed). It is
# generated once at home and stored in <state>/secrets/modal/front.token; the SAME value goes to both places:
#   Modal:  modal secret create speaktome-front SPEAKTOME_FRONT_TOKEN="$(cat <state>/secrets/modal/front.token)"
#   Apache: root-only /etc/apache2/conf-available/speaktome-secrets.conf, written on the host from stdin by
#           deploy/linux/install-modal-front-secret.sh (it reads the token itself, so nothing expands it early; it refuses
#           an empty or non-url-safe token, then a2enconf, configtest and reload):
#           tr -d '\r\n' < <state>/secrets/modal/front.token | \
#             ssh <host> 'sudo bash <turing>/examples/meowdoku/deploy/linux/install-modal-front-secret.sh'
# Until that definition exists, modal.speaktome.dev answers the not-yet page (the IfDefine below), so the config stays
# valid and nothing reaches Modal without the token.
#
# DNS (Cloudflare zone speaktome.dev, DNS only / grey cloud). Every public name resolves to THIS host; Apache here
# holds TLS for all of them (one certificate) and relays each to where it really runs:
#
#   name                  A record        answered by                       upstream
#   speaktome.dev         170.9.251.90    this host's Apache                http://127.0.0.1:8766 (own stack, meowdoku-a)
#   www.speaktome.dev     170.9.251.90    this host's Apache                301 -> https://speaktome.dev/
#   home.speaktome.dev    170.9.251.90    this host's Apache                https://stichka.duckdns.org:8766 (home)
#   oracle.speaktome.dev  170.9.251.90    this host's Apache                link sockets -> 127.0.0.1:47616; else 503
#   modal.speaktome.dev   170.9.251.90    this host's Apache                the Modal front (token-gated)
#
# home. cannot point at the home machine directly: home answers only on :8766 (its public :443/:80 are closed) and
# its duckdns name follows the dynamic address, so the relay here is what lets people see a plain home.speaktome.dev.
# modal. cannot be a CNAME to Modal: Modal's certificate does not carry our names.

Define SPEAKTOME_HOME_UPSTREAM "https://stichka.duckdns.org:8766"
# The Modal front's own address (modal deploy prints it: <workspace>--<app>-<function>.<region>.modal.run).
Define SPEAKTOME_MODAL_UPSTREAM "https://albert-stichka--speaktome-modal-front-front.us-east.modal.run"
# A published copy of deploy/apache/condition/, so a checkout move never changes what the reserved names answer.
Define SPEAKTOME_CONDITION_DIR "/var/www/speaktome-condition"
# This host's Nodus link listener (run_canvas link_host ... port), loopback only.
Define SPEAKTOME_LINK_UPSTREAM "127.0.0.1:47616"
# Each hosted link's own loopback port, by its name: the row nodus.link.route writes one line "<name> 127.0.0.1:<port>"
# per link and takes it out when the link goes (owner, 2026-11-23: many links on one public port, the front negotiating
# the ports). Apache rereads the file when it changes; a name not in it goes to SPEAKTOME_LINK_UPSTREAM. Apache refuses
# to start without the file, so make it once (as root):
#   install -d -o nodus -g nodus -m 755 /srv/svc/link-routes
#   sudo -u nodus sh -c 'echo "# Nodus link routes" > /srv/svc/link-routes/link.map'
Define SPEAKTOME_LINK_ROUTES "/srv/svc/link-routes/link.map"
# The apex: this host's own SpeakToMe, the repository's server run by the stack (oracle-stack.conf ->
# apache_supervisor.py -> deploy/linux/instances.json, instance meowdoku-a, loopback HTTP). Owner, 2026-11-26: run the
# repo there, not a copied site. Its pages are what `stm publish` exported from the live turing checkout.
Define SPEAKTOME_SITE_UPSTREAM "http://127.0.0.1:8766"
# One certificate names every host.
Define SPEAKTOME_CERT_DIR "/etc/letsencrypt/live/home.speaktome.dev"

<Directory "${SPEAKTOME_CONDITION_DIR}">
    Require all granted
</Directory>

# ---- :80, every name: the ACME challenge passes, everything else goes to https -------------------------------------
<VirtualHost *:80>
    ServerName home.speaktome.dev
    ServerAlias oracle.speaktome.dev modal.speaktome.dev speaktome.dev www.speaktome.dev
    DocumentRoot "${SPEAKTOME_CONDITION_DIR}"
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/front-http-error.log
    CustomLog ${APACHE_LOG_DIR}/front-http-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
# ---- home: relay to the home server ---------------------------------------------------------------------------------
# Home stays the FIRST *:443 vhost, so a name no vhost claims falls to the home relay as before this file named the
# apex (claude, review 7e5f6873 comment 754). Making the apex the default is the owner's call, not this file's.
<VirtualHost *:443>
    ServerName home.speaktome.dev
    SSLEngine on
    SSLCertificateFile    "${SPEAKTOME_CERT_DIR}/fullchain.pem"
    SSLCertificateKeyFile "${SPEAKTOME_CERT_DIR}/privkey.pem"
    SSLProxyEngine on
    SSLProxyVerify require
    # mod_ssl's proxy side reads no CA store of its own and stops at depth 1; the home chain is leaf + intermediate.
    SSLProxyCACertificateFile /etc/ssl/certs/ca-certificates.crt
    SSLProxyVerifyDepth 10
    SSLProxyCheckPeerName on
    # The home certificate names stichka.duckdns.org, so the upstream keeps its own Host (no ProxyPreserveHost).
    ProxyPreserveHost off
    ProxyRequests off
    ProxyTimeout 300
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        "/" "${SPEAKTOME_HOME_UPSTREAM}/" upgrade=websocket
    ProxyPassReverse "/" "${SPEAKTOME_HOME_UPSTREAM}/"
    # Redirects and cookies the home server writes name its own address; point them back at this name.
    ProxyPassReverseCookieDomain "stichka.duckdns.org" "home.speaktome.dev"
    ErrorLog ${APACHE_LOG_DIR}/home-front-error.log
    CustomLog ${APACHE_LOG_DIR}/home-front-access.log combined
</VirtualHost>

# ---- apex: this host's own SpeakToMe (the stack's meowdoku-a); www redirects to it ----------------------------------
<VirtualHost *:443>
    ServerName speaktome.dev
    SSLEngine on
    SSLCertificateFile    "${SPEAKTOME_CERT_DIR}/fullchain.pem"
    SSLCertificateKeyFile "${SPEAKTOME_CERT_DIR}/privkey.pem"
    # As the Windows front (meowdoku-proxy.conf): the server sees the public name and scheme; loopback is its trusted
    # proxy, so X-Forwarded-For names the client.
    ProxyPreserveHost on
    ProxyRequests off
    ProxyTimeout 300
    RequestHeader set X-Forwarded-Proto "https"
    # Admin stays loopback-direct and is NOT proxied: the server refuses forwarded admin requests anyway.
    ProxyPass        "/api/admin" !
    ProxyPass        "/api/admin/" !
    # The stack down answers the not-yet page (served here, never proxied) rather than a bare proxy error.
    ProxyPass        "/not-yet.html" !
    Alias            "/not-yet.html" "${SPEAKTOME_CONDITION_DIR}/not-yet.html"
    ProxyPass        "/" "${SPEAKTOME_SITE_UPSTREAM}/" upgrade=websocket
    ProxyPassReverse "/" "${SPEAKTOME_SITE_UPSTREAM}/"
    ErrorDocument 502 /not-yet.html
    ErrorDocument 503 /not-yet.html
    ErrorLog ${APACHE_LOG_DIR}/site-front-error.log
    CustomLog ${APACHE_LOG_DIR}/site-front-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName www.speaktome.dev
    SSLEngine on
    SSLCertificateFile    "${SPEAKTOME_CERT_DIR}/fullchain.pem"
    SSLCertificateKeyFile "${SPEAKTOME_CERT_DIR}/privkey.pem"
    Redirect permanent "/" "https://speaktome.dev/"
    ErrorLog ${APACHE_LOG_DIR}/site-front-error.log
    CustomLog ${APACHE_LOG_DIR}/site-front-access.log combined
</VirtualHost>

# ---- modal: relay to the Modal operator's front (deploy/modal/front_app.py) -----------------------------------------
# The front refuses any request without X-SpeakToMe-Front; Apache sets it (replacing whatever a client sent) from
# SPEAKTOME_MODAL_FRONT_TOKEN, defined in /etc/apache2/conf-available/speaktome-secrets.conf (root, 0600, a2enconf),
# which Apache reads before the sites. That file is written from home <state>/secrets/modal/front.token.
<IfDefine SPEAKTOME_MODAL_FRONT_TOKEN>
<VirtualHost *:443>
    ServerName modal.speaktome.dev
    SSLEngine on
    SSLCertificateFile    "${SPEAKTOME_CERT_DIR}/fullchain.pem"
    SSLCertificateKeyFile "${SPEAKTOME_CERT_DIR}/privkey.pem"
    SSLProxyEngine on
    SSLProxyVerify require
    SSLProxyCACertificateFile /etc/ssl/certs/ca-certificates.crt
    SSLProxyVerifyDepth 10
    SSLProxyCheckPeerName on
    ProxyPreserveHost off
    ProxyRequests off
    ProxyTimeout 300
    RequestHeader set X-SpeakToMe-Front "${SPEAKTOME_MODAL_FRONT_TOKEN}"
    ProxyPass        "/" "${SPEAKTOME_MODAL_UPSTREAM}/"
    ProxyPassReverse "/" "${SPEAKTOME_MODAL_UPSTREAM}/"
    ErrorLog ${APACHE_LOG_DIR}/modal-front-error.log
    CustomLog ${APACHE_LOG_DIR}/modal-front-access.log combined
</VirtualHost>
</IfDefine>

# ---- oracle: reserved, not serving yet ------------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName oracle.speaktome.dev
    # Without the Modal token defined, modal.speaktome.dev is reserved here too (see the install notes above).
    <IfDefine !SPEAKTOME_MODAL_FRONT_TOKEN>
        ServerAlias modal.speaktome.dev
    </IfDefine>
    SSLEngine on
    SSLCertificateFile    "${SPEAKTOME_CERT_DIR}/fullchain.pem"
    SSLCertificateKeyFile "${SPEAKTOME_CERT_DIR}/privkey.pem"
    DocumentRoot "${SPEAKTOME_CONDITION_DIR}"
    RewriteEngine on
    # [LINK] Nodus link sockets: wss://oracle.speaktome.dev/ws/link/<prefix>/{control,bulk} go to this host's link
    # listener on loopback (run_canvas link_host), as the Windows front sends /ws/link/ to 47616. A link is admitted only
    # by its tickets, which the listener checks with its key; Apache only carries the socket. The route map sends each
    # link name to its own listener (tests/link_route_front.ps1 in nodus runs this rule on a private Apache).
    RewriteMap linkroutes "txt:${SPEAKTOME_LINK_ROUTES}"
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws/link/([A-Za-z0-9._-]+)/(control|bulk)$ ws://${linkroutes:$1|${SPEAKTOME_LINK_UPSTREAM}}/ws/link/$1/$2 [P,L]
    RewriteCond %{REQUEST_URI} !=/not-yet.html
    RewriteRule ^ - [R=503,L]
    ErrorDocument 503 /not-yet.html
    ErrorLog ${APACHE_LOG_DIR}/reserved-front-error.log
    CustomLog ${APACHE_LOG_DIR}/reserved-front-access.log combined
</VirtualHost>
</IfModule>
